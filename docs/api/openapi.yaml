                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/AuditLog' } }
  /v1/audit-logs/{id}:
    get:
      tags: [Audit]
      summary: Détail d'un log d'audit
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        200:
          description: Log d'audit
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditLog' }

  # ========== SYNC LOGS ==========
  /v1/sync-logs:
    get:
      tags: [Synchronisation]
      summary: Liste paginée des logs de synchronisation
      parameters:
        - name: entite_type
          in: query
          schema: { type: string }
        - name: est_synchronise
          in: query
          schema: { type: boolean }
        - name: per_page
          in: query
          schema: { type: integer, default: 50 }
      responses:
        200:
          description: Logs de synchronisation
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/SyncLogFull' } }
  /v1/sync-logs/{id}:
    get:
      tags: [Synchronisation]
      summary: Détail d'un log de synchronisation
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        200:
          description: Log de synchronisation

  # ========== USERS ==========
  /v1/users:
    get:
      tags: [Utilisateurs]
      summary: Liste paginée des utilisateurs
      parameters:
        - name: search
          in: query
          schema: { type: string }
        - name: per_page
          in: query
          schema: { type: integer, default: 15 }
      responses:
        200:
          description: Liste des utilisateurs
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/User' } }
    post:
      tags: [Utilisateurs]
      summary: Crée un utilisateur
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserInput' }
      responses:
        201:
          description: Utilisateur créé
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        422: { $ref: '#/components/responses/ValidationError' }
  /v1/users/{id}:
    get:
      tags: [Utilisateurs]
      summary: Détail d'un utilisateur
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        200:
          description: Utilisateur
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
    put:
      tags: [Utilisateurs]
      summary: Met à jour un utilisateur
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserUpdate' }
      responses:
        200:
          description: Utilisateur mis à jour
    delete:
      tags: [Utilisateurs]
      summary: Supprime un utilisateur
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        200:
          description: Utilisateur supprimé
        422:
          description: Impossible de supprimer son propre compte

  # ========== ROLES ==========
  /v1/roles:
    get:
      tags: [Rôles]
      summary: Liste des rôles avec leurs permissions
      responses:
        200:
          description: Rôles
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Role' }
    post:
      tags: [Rôles]
      summary: Crée un rôle avec ses permissions
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoleInput' }
      responses:
        201:
          description: Rôle créé
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Role' }
        422: { $ref: '#/components/responses/ValidationError' }
  /v1/roles/{id}:
    get:
      tags: [Rôles]
      summary: Détail d'un rôle avec ses permissions
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        200:
          description: Rôle
    put:
      tags: [Rôles]
      summary: Met à jour un rôle et ses permissions
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoleInput' }
      responses:
        200:
          description: Rôle mis à jour
    delete:
      tags: [Rôles]
      summary: Supprime un rôle
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        200:
          description: Rôle supprimé
        422:
          description: Impossible de supprimer le rôle Super Admin

  # ========== PERMISSIONS ==========
  /v1/permissions:
    get:
      tags: [Permissions]
      summary: Liste des permissions
      responses:
        200:
          description: Permissions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Permission' }
    post:
      tags: [Permissions]
      summary: Crée une permission
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PermissionInput' }
      responses:
        201:
          description: Permission créée
        422: { $ref: '#/components/responses/ValidationError' }
  /v1/permissions/{id}:
    get:
      tags: [Permissions]
      summary: Détail d'une permission
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        200:
          description: Permission
    put:
      tags: [Permissions]
      summary: Met à jour une permission
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PermissionInput' }
      responses:
        200:
          description: Permission mise à jour
    delete:
      tags: [Permissions]
      summary: Supprime une permission
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        200:
          description: Permission supprimée

  # ========== HEALTH ==========
  /health:
    get:
      tags: [Health]
      summary: Vérification de l'état du service
      security: []
      responses:
        200:
          description: Service en ligne
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthResponse' }

