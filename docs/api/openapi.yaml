openapi: 3.0.3
info:
  title: CRM SavoirManger — API DIGITRANS-CM
  description: API REST du module CRM pour les restaurants SavoirManger (projet DIGITRANS-CM / AGROCAM S.A.)
  version: 1.0.0
  contact:
    name: CAMTECH SOLUTIONS S.A.
    email: support@camtech.cm
  x-business-unit: Module CRM
  x-project: DIGITRANS-CM

servers:
  - url: /api
    description: Serveur local via proxy Vite
  - url: https://staging.crm.savoirmanager.cm/api
    description: Environnement de staging (AWS af-south-1)
  - url: https://crm.savoirmanager.cm/api
    description: Production

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum
      description: Authentification par token Sanctum. Obtenir un token via POST /api/auth/login.

  schemas:
    # ---------- Auth ----------
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, example: admin@savoirmanager.cm }
        password: { type: string, format: password, example: password }
        device_name: { type: string, example: "crm-web" }
    LoginResponse:
      type: object
      properties:
        user:
          type: object
          properties:
            id: { type: integer }
            name: { type: string }
            email: { type: string }
        token: { type: string, example: "1|abc123..." }
    LogoutResponse:
      type: object
      properties:
        message: { type: string, example: "Déconnexion réussie" }

    # ---------- Client ----------
    Client:
      type: object
      properties:
        id: { type: string, format: uuid }
        nom: { type: string, maxLength: 50 }
        prenom: { type: string, maxLength: 50 }
        email: { type: string, format: email }
        telephone: { type: string, nullable: true }
        date_naissance: { type: string, format: date, nullable: true }
        est_fidelite: { type: boolean }
        points_fidelite: { type: integer }
        segment: { type: string, enum: [standard, premium, vip] }
        preferences: { type: object, nullable: true }
        notes: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ClientInput:
      type: object
      required: [nom, prenom, email]
      properties:
        nom: { type: string, maxLength: 50, example: "Moukam" }
        prenom: { type: string, maxLength: 50, example: "Henri" }
        email: { type: string, format: email, example: "hc.moukam@agrocam.cm" }
        telephone: { type: string, example: "691234567" }
        date_naissance: { type: string, format: date, example: "1985-06-15" }
        segment: { type: string, enum: [standard, premium, vip] }
        preferences: { type: object, example: { allergies: ["arachides"], plats_preferes: ["Poulet DG"] } }
        notes: { type: string }
    ClientStats:
      type: object
      properties:
        total: { type: integer, example: 150 }
        par_segment:
          type: object
          properties:
            standard: { type: integer, example: 80 }
            premium: { type: integer, example: 50 }
            vip: { type: integer, example: 20 }
        fideles: { type: integer, example: 70 }
        nouveaux_mois: { type: integer, example: 12 }

    # ---------- Commande ----------
    Commande:
      type: object
      properties:
        id: { type: string, format: uuid }
        client: { $ref: '#/components/schemas/Client' }
        restaurant: { $ref: '#/components/schemas/Restaurant' }
        statut: { type: string, enum: [en_attente, confirmee, en_preparation, prete, livree, annulee] }
        montant_total: { type: number, format: float, example: 15500 }
        devise: { type: string, example: "FCFA" }
        type_commande: { type: string, enum: [sur_place, a_emporter, livraison] }
        notes: { type: string, nullable: true }
        ligne_commandes:
          type: array
          items: { $ref: '#/components/schemas/LigneCommande' }
        est_synchronise: { type: boolean }
        created_at: { type: string, format: date-time }
    CommandeInput:
      type: object
      required: [client_id, restaurant_id, type_commande, lignes]
      properties:
        client_id: { type: string, format: uuid }
        restaurant_id: { type: string, format: uuid }
        type_commande: { type: string, enum: [sur_place, a_emporter, livraison] }
        notes: { type: string }
        est_synchronise: { type: boolean, default: true }
        lignes:
          type: array
          minItems: 1
          items:
            type: object
            required: [plat_id, quantite]
            properties:
              plat_id: { type: string, format: uuid }
              quantite: { type: integer, minimum: 1 }
              notes: { type: string }
    CommandeStatutInput:
      type: object
      required: [statut]
      properties:
        statut: { type: string, enum: [en_attente, confirmee, en_preparation, prete, livree, annulee] }

    # ---------- LigneCommande ----------
    LigneCommande:
      type: object
      properties:
        id: { type: string, format: uuid }
        plat_id: { type: string, format: uuid }
        plat: { $ref: '#/components/schemas/Plat' }
        quantite: { type: integer, example: 2 }
        prix_unitaire: { type: number, format: float, example: 6500 }
        sous_total: { type: number, format: float, example: 13000 }
        notes: { type: string, nullable: true }

    # ---------- Restaurant ----------
    Restaurant:
      type: object
      properties:
        id: { type: string, format: uuid }
        nom: { type: string, example: "SavoirManger Bonanjo" }
        ville: { type: string, example: "Douala" }
        quartier: { type: string, nullable: true }
        commandes_count: { type: integer, example: 85 }
        avis_count: { type: integer, example: 42 }
        avis_avg_note: { type: number, format: float, example: 4.2 }

    # ---------- Plat ----------
    Plat:
      type: object
      properties:
        id: { type: string, format: uuid }
        categorie_id: { type: string, format: uuid }
        categorie: { $ref: '#/components/schemas/Categorie' }
        nom: { type: string, example: "Poulet DG" }
        description: { type: string, nullable: true }
        prix_unitaire: { type: number, format: float, example: 6500 }
        devise: { type: string, default: "FCFA" }
        disponible: { type: boolean, default: true }
        image_url: { type: string, nullable: true }
    PlatInput:
      type: object
      required: [categorie_id, nom, prix_unitaire]
      properties:
        categorie_id: { type: string, format: uuid }
        nom: { type: string, maxLength: 100 }
        description: { type: string }
        prix_unitaire: { type: number, minimum: 0 }
        devise: { type: string, default: "FCFA" }
        disponible: { type: boolean }
        image_url: { type: string, format: uri }

    # ---------- Categorie ----------
    Categorie:
      type: object
      properties:
        id: { type: string, format: uuid }
        nom: { type: string, example: "Plats Principaux" }
        description: { type: string, nullable: true }
        plats_count: { type: integer, example: 4 }
    CategorieInput:
      type: object
      required: [nom]
      properties:
        nom: { type: string, maxLength: 50 }
        description: { type: string }

    # ---------- Fidelite ----------
    PointsResponse:
      type: object
      properties:
        client:
          type: object
          properties:
            id: { type: string, format: uuid }
            nom_complet: { type: string }
            points_fidelite: { type: integer }
            est_fidelite: { type: boolean }
        transactions:
          type: object
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/TransactionFidelite' }
    TransactionFidelite:
      type: object
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [gain, echange, expiration] }
        points: { type: integer }
        solde_avant: { type: integer }
        solde_apres: { type: integer }
        description: { type: string }
        created_at: { type: string, format: date-time }
    AjouterPointsInput:
      type: object
      required: [client_id, commande_id, points]
      properties:
        client_id: { type: string, format: uuid }
        commande_id: { type: string, format: uuid }
        points: { type: integer, minimum: 1 }
    Recompense:
      type: object
      properties:
        id: { type: string, format: uuid }
        nom: { type: string, example: "Café offert" }
        description: { type: string, nullable: true }
        points_requis: { type: integer, example: 100 }
        type: { type: string, enum: [produit_offert, reduction, menu_gratuit] }
        valeur: { type: number, format: float, nullable: true }
        stock: { type: integer }
        est_active: { type: boolean }
    EchangerPointsInput:
      type: object
      required: [client_id, recompense_id]
      properties:
        client_id: { type: string, format: uuid }
        recompense_id: { type: string, format: uuid }
    EchangeResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        client_id: { type: string, format: uuid }
        recompense_id: { type: string, format: uuid }
        points_utilises: { type: integer }
        code_utilisation: { type: string, example: "CRM-A3F8B2" }
        expire_le: { type: string, format: date }
        created_at: { type: string, format: date-time }

    # ---------- Avis ----------
    Avis:
      type: object
      properties:
        id: { type: string, format: uuid }
        client: { $ref: '#/components/schemas/Client' }
        commande_id: { type: string, format: uuid }
        restaurant: { $ref: '#/components/schemas/Restaurant' }
        note: { type: integer, minimum: 1, maximum: 5 }
        commentaire: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
    AvisInput:
      type: object
      required: [client_id, commande_id, restaurant_id, note]
      properties:
        client_id: { type: string, format: uuid }
        commande_id: { type: string, format: uuid }
        restaurant_id: { type: string, format: uuid }
        note: { type: integer, minimum: 1, maximum: 5 }
        commentaire: { type: string, maxLength: 1000 }
    AvisAnalyse:
      type: object
      properties:
        moyenne: { type: number, format: float, example: 4.2 }
        repartition:
          type: object
          properties:
            1: { type: integer }
            2: { type: integer }
            3: { type: integer }
            4: { type: integer }
            5: { type: integer }
        total_avis: { type: integer, example: 85 }
        pourcentage_positif: { type: number, format: float, example: 82.4 }

    # ---------- Dashboard ----------
    DashboardKpi:
      type: object
      properties:
        chiffre_affaires: { type: number, format: float, example: 4500000 }
        total_commandes: { type: integer, example: 320 }
        clients_servis: { type: integer, example: 180 }
        panier_moyen: { type: number, format: float, example: 14062.5 }
        commandes_par_statut:
          type: object
          properties:
            en_attente: { type: integer, example: 45 }
            confirmee: { type: integer, example: 60 }
            en_preparation: { type: integer, example: 55 }
            prete: { type: integer, example: 80 }
            livree: { type: integer, example: 70 }
            annulee: { type: integer, example: 10 }
        note_moyenne: { type: number, format: float, example: 4.2 }
    DashboardEvolution:
      type: array
      items:
        type: object
        properties:
          mois: { type: string, format: date-time }
          total_commandes: { type: integer }
          chiffre_affaires: { type: number, format: float }
    TopClient:
      type: object
      properties:
        id: { type: string, format: uuid }
        nom_complet: { type: string }
        commandes_count: { type: integer }
        commandes_sum_montant_total: { type: number, format: float }

    # ---------- Sync ----------
    SyncRequest:
      type: object
      required: [entites]
      properties:
        entites:
          type: array
          items:
            type: object
            required: [type, action, payload]
            properties:
              type: { type: string, enum: [commande, avis, client] }
              action: { type: string, enum: [create, update] }
              payload: { type: object }
    SyncResponse:
      type: object
      properties:
        success: { type: boolean }
        synchronises: { type: integer }
        resultats:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid, nullable: true }
              type: { type: string }
              action: { type: string }

    # ---------- Error ----------
    Error422:
      type: object
      properties:
        message: { type: string }
        errors:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
    Error401:
      type: object
      properties:
        message: { type: string, example: "Unauthenticated." }
    Error404:
      type: object
      properties:
        message: { type: string, example: "Resource not found" }
    HealthResponse:
      type: object
      properties:
        status: { type: string, example: "ok" }
        module: { type: string, example: "CRM SavoirManger" }
        version: { type: string, example: "1.0.0" }
        timestamp: { type: string, format: date-time }

    # ---------- Restaurant ----------
    RestaurantInput:
      type: object
      required: [nom, ville]
      properties:
        nom: { type: string, maxLength: 100, example: "SavoirManger Bonanjo" }
        ville: { type: string, maxLength: 50, example: "Douala" }
        quartier: { type: string, example: "Bonanjo" }
        adresse: { type: string, example: "123 Rue Principale" }
        telephone: { type: string, example: "691234567" }
        email: { type: string, format: email }
        est_actif: { type: boolean, default: true }
        capacite: { type: integer, minimum: 1, example: 50 }

    # ---------- PalierFidelite ----------
    PalierFidelite:
      type: object
      properties:
        id: { type: string, format: uuid }
        nom: { type: string, example: "Or" }
        points_minimum: { type: integer, example: 1500 }
        points_maximum: { type: integer, nullable: true, example: 4999 }
        description: { type: string, nullable: true }
    PalierFideliteInput:
      type: object
      required: [nom, points_minimum]
      properties:
        nom: { type: string, maxLength: 50 }
        points_minimum: { type: integer, minimum: 0 }
        points_maximum: { type: integer, nullable: true }
        description: { type: string }

    # ---------- Recompense (CRUD) ----------
    RecompenseInput:
      type: object
      required: [nom, points_requis]
      properties:
        nom: { type: string, maxLength: 100 }
        description: { type: string }
        points_requis: { type: integer, minimum: 1 }
        type: { type: string, enum: [produit_offert, reduction, menu_gratuit] }
        valeur: { type: number, format: float }
        stock: { type: integer, default: 999 }
        est_active: { type: boolean, default: true }

    # ---------- EchangeRecompense ----------
    EchangeRecompense:
      type: object
      properties:
        id: { type: string, format: uuid }
        client: { $ref: '#/components/schemas/Client' }
        recompense: { $ref: '#/components/schemas/Recompense' }
        points_utilises: { type: integer }
        statut: { type: string, enum: [valide, utilise, expire, annule] }
        code_utilisation: { type: string }
        expire_le: { type: string, format: date, nullable: true }
        created_at: { type: string, format: date-time }
    EchangeStatutInput:
      type: object
      required: [statut]
      properties:
        statut: { type: string, enum: [valide, utilise, expire, annule] }

    # ---------- TransactionFidelite ----------
    TransactionFideliteFull:
      type: object
      properties:
        id: { type: string, format: uuid }
        client: { $ref: '#/components/schemas/Client' }
        type: { type: string, enum: [gain, echange] }
        points: { type: integer }
        solde_avant: { type: integer }
        solde_apres: { type: integer }
        description: { type: string }
        created_at: { type: string, format: date-time }

    # ---------- LigneCommande ----------
    LigneCommandeInput:
      type: object
      required: [commande_id, plat_id, quantite, prix_unitaire]
      properties:
        commande_id: { type: string, format: uuid }
        plat_id: { type: string, format: uuid }
        quantite: { type: integer, minimum: 1 }
        prix_unitaire: { type: number, minimum: 0 }
        notes: { type: string }

    # ---------- User ----------
    User:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string, format: email }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    UserInput:
      type: object
      required: [name, email, password]
      properties:
        name: { type: string, maxLength: 255 }
        email: { type: string, format: email }
        password: { type: string, format: password, minLength: 8 }
    UserUpdate:
      type: object
      properties:
        name: { type: string, maxLength: 255 }
        email: { type: string, format: email }
        password: { type: string, format: password, minLength: 8 }

    # ---------- Role ----------
    Role:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        guard_name: { type: string }
        permissions: { type: array, items: { $ref: '#/components/schemas/Permission' } }
        created_at: { type: string, format: date-time }
    RoleInput:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 255 }
        permissions: { type: array, items: { type: string }, description: "Liste des noms de permissions" }

    # ---------- Permission ----------
    Permission:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        guard_name: { type: string }
        created_at: { type: string, format: date-time }
    PermissionInput:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 255 }

    # ---------- AuditLog ----------
    AuditLog:
      type: object
      properties:
        id: { type: string, format: uuid }
        utilisateur_id: { type: string, nullable: true }
        action: { type: string, enum: [create, update, delete] }
        entite_type: { type: string }
        entite_id: { type: string, nullable: true }
        anciennes_valeurs: { type: object, nullable: true }
        nouvelles_valeurs: { type: object, nullable: true }
        adresse_ip: { type: string, nullable: true }
        created_at: { type: string, format: date-time }

    # ---------- SyncLog ----------
    SyncLogFull:
      type: object
      properties:
        id: { type: string, format: uuid }
        entite_type: { type: string }
        entite_id: { type: string, nullable: true }
        action: { type: string }
        payload: { type: object }
        est_synchronise: { type: boolean }
        synced_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }

  responses:
    Unauthorized:
      description: Token manquant ou invalide
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error401' }
    NotFound:
      description: Ressource introuvable
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error404' }
    ValidationError:
      description: Erreur de validation
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error422' }
    Avis:
      description: Avis
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Avis' }

security:
  - bearerAuth: []

paths:
  # ========== AUTH ==========
  /auth/login:
    post:
      tags: [Authentification]
      summary: Authentification et obtention d'un token Sanctum
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        200:
          description: Connexion réussie
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        422:
          description: Identifiants invalides
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error422' }
  /auth/logout:
    post:
      tags: [Authentification]
      summary: Révoque le token courant
      responses:
        200:
          description: Déconnexion réussie
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LogoutResponse' }
        401:
          description: Non authentifié
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error401' }

  # ========== CLIENTS ==========
  /v1/clients:
    get:
      tags: [Clients]
      summary: Liste paginée des clients
      parameters:
        - name: search
          in: query
          schema: { type: string }
          description: Recherche par nom, prénom ou email
        - name: segment
          in: query
          schema: { type: string, enum: [standard, premium, vip] }
          description: Filtre par segment
        - name: per_page
          in: query
          schema: { type: integer, default: 15, maximum: 100 }
      responses:
        200:
          description: Liste des clients
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Client' } }
                  meta: { type: object }
        401: { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Clients]
      summary: Crée un nouveau client
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClientInput' }
      responses:
        201:
          description: Client créé
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Client' }
        422:
          description: Données invalides
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error422' }
  /v1/clients/statistiques:
    get:
      tags: [Clients]
      summary: Statistiques globales des clients
      responses:
        200:
          description: Statistiques
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClientStats' }
  /v1/clients/{id}:
    get:
      tags: [Clients]
      summary: Détail d'un client avec commandes et avis
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        200:
          description: Fiche client détaillée
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Client' }
        404: { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Clients]
      summary: Met à jour un client
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: '#/components/schemas/ClientInput' }
                - type: object
                  properties:
                    email: { type: string, description: "L'email peut être le même que l'existant" }
      responses:
        200:
          description: Client mis à jour
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Client' }
        422: { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Clients]
      summary: Supprime un client
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        200:
          description: Client supprimé
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: "Client supprimé" }
        404: { $ref: '#/components/responses/NotFound' }

  # ========== COMMANDES ==========
  /v1/commandes:
    get:
      tags: [Commandes]
      summary: Liste paginée des commandes
      parameters:
        - name: client_id
          in: query
          schema: { type: string, format: uuid }
        - name: restaurant_id
          in: query
          schema: { type: string, format: uuid }
        - name: statut
          in: query
          schema: { type: string, enum: [en_attente, confirmee, en_preparation, prete, livree, annulee] }
